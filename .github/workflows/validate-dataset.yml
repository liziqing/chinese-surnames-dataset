name: Validate dataset

on:
  push:
    branches: [main]
    paths:
      - "surnames.json"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "surnames.json"
      - "schema/**"
      - "scripts/**"
      - ".github/workflows/validate-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23,<5"

      - name: Validate dataset
        run: python scripts/validate_dataset.py
